[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bert-pytorch-demo"
version = "0.1.0"
description = "Pass one sentence through BERT with PyTorch."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "transformers>=4.48,<5",
    "datasets>=3.0",
]

[project.scripts]
bert-demo = "bert_demo.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
