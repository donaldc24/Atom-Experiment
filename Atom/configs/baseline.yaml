# Starter values frozen by docs/h1_experiment_spec.md.
# Typed configuration loading is implemented in roadmap chunk 2.
experiment_name: independent_lora
base_model: prajjwal1/bert-tiny
seed: 17
confirmatory_seeds:
  - 17
  - 29
  - 43
device: cpu
max_length: 128
batch_size: 8
learning_rate: 0.0003
epochs: 3
weight_decay: 0.01
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 0.00000001
learning_rate_schedule: constant
train_examples_per_task: 2000
validation_examples_per_task: 500
tasks:
  - sst2
  - mrpc
  - rte
  - qnli
  - qqp
target_modules:
  - query
  - value
lora_rank: 4
lora_alpha: 4
lora_dropout: 0.0
atom_count: 8
active_atoms_during_training: 8
active_atoms_for_primary_evaluation: 4
atom_scaling: 1.0
sparsity_lambda: 0.00001
