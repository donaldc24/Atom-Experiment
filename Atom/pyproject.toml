[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cgmoe-h1"
version = "0.1.0"
description = "Controlled experiment comparing independent LoRA adapters with shared rank-1 atoms."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0",
    "evaluate>=0.4",
    "numpy>=1.26",
    "psutil>=6.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "torch>=2.6",
    "tqdm>=4.66",
    "transformers>=4.48,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cgmoe-h1 = "cgmoe_h1.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
